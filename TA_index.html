<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TA Entry / View</title>
<link rel="stylesheet" href="TAstyle.css">
</head>
<body>

<header class="sticky-header">
  <button id="btnEntry" class="tab-btn active">Entry</button>
  <button id="btnView" class="tab-btn">View</button>
</header>

<!-- ================= ENTRY PAGE ================= -->
<main id="entryPage" class="page active">
  <form id="taForm" class="form-grid" autocomplete="off">

    <div class="field-group half" id="grp-name">
      <label for="fldName">Name Of Employee</label>
      <input type="text" id="fldName" readonly>
    </div>

    <div class="field-group half" id="grp-designation">
      <label for="fldDesignation">Designation</label>
      <input type="text" id="fldDesignation" readonly>
    </div>

    <div class="field-group full-width" id="grp-date">
      <label for="fldDate">Date</label>
      <input type="date" id="fldDate">
    </div>

    <div class="field-group full-width" id="grp-object">
      <label for="fldObject">Object Of Journey</label>
      <textarea id="fldObject" rows="3"></textarea>
    </div>

    <div class="field-group half" id="grp-left">
      <label for="fldLeft">Left Time</label>
      <input type="time" id="fldLeft">
    </div>

    <div class="field-group half" id="grp-arrived">
      <label for="fldArrived">Arrived Time</label>
      <input type="time" id="fldArrived">
    </div>

    <div class="field-group half" id="grp-from">
      <label for="fldFrom">From</label>
      <input type="text" id="fldFrom" value="KKSO" readonly>
    </div>

    <div class="field-group half" id="grp-to">
      <label for="fldTo">To</label>
      <select id="fldTo"><option value="">-- Select Station --</option></select>
    </div>

    <div class="field-group half" id="grp-ta">
      <label for="fldTA">%TA</label>
      <input type="text" id="fldTA" readonly>
    </div>

    <div class="field-group half" id="grp-bookedby">
      <label for="fldBookedBy">Booked By</label>
      <select id="fldBookedBy"><option value="">-- Select Supervisor --</option></select>
    </div>

    <button type="submit" id="submitBtn" class="full-width">Submit</button>
    
    
  </form>
</main>

<!-- ================= VIEW PAGE ================= -->
<main id="viewPage" class="page">
  <div class="view-toolbar">
    <select id="monthSelect"></select>
    <button id="refreshBtn">Refresh</button>
    <button id="downloadBtn">Download</button>
  </div>

  <div class="summary">
    <div class="summary-box">Total TA: <span id="totalTA">0</span></div>
    <div class="summary-box">Total Amount: <span id="totalAmount">0</span></div>
  </div>

  <div id="viewStatus"></div>

  <div class="table-wrapper">
    <table id="viewTable">
      <thead>
        <tr>
          <th>SNo</th><th>Name</th><th>Designation</th><th>Date</th>
          <th>Object</th><th>Left</th><th>Arrived</th><th>From</th>
          <th>To</th><th>%TA</th><th>Booked By</th>
        </tr>
      </thead>
      <tbody id="viewTableBody"></tbody>
    </table>
  </div>

  <!-- ============ PDF TEMPLATE PLACEHOLDER (future use) ============
       Reserved hidden container for future PDF generation.
       See generatePDF() in script.js for integration steps.
  ================================================================== -->
  <div id="pdf-template" style="display:none;"></div>

</main>

<script src="TAMapping.js"></script>
<script src="TAscript2.js"></script>
</body>
</html>
